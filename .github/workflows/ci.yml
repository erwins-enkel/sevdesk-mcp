name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the steps in sync with the `verify` script that the pre-push hook runs. Linux runs every
  # step; macOS and Windows (decision 20) run install, tests and build, because the other steps
  # are platform-independent tooling. Linux keeps the names `quality (node 22|24)`: they are the
  # required status checks on main.
  quality:
    name: quality (${{ matrix.os != 'ubuntu-latest' && format('{0}, ', matrix.os) || '' }}node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: bun install --frozen-lockfile
      - name: Format
        if: runner.os == 'Linux'
        run: bun run format:check
      - name: Lint
        if: runner.os == 'Linux'
        run: bun run lint
      - name: Typecheck
        if: runner.os == 'Linux'
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - name: i18n catalog parity
        if: runner.os == 'Linux'
        run: bun run check:i18n
      - name: Dead-code audit (fallow)
        if: runner.os == 'Linux'
        run: bun run audit:dead
      - name: Env schema audit (varlock)
        if: runner.os == 'Linux'
        run: bun run audit:env
      - name: Workflow lint (actionlint)
        if: runner.os == 'Linux'
        run: bun run lint:actions
