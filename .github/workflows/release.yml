name: Release

# A pushed tag vX.Y.Z publishes the package to npm and creates the GitHub release (decision 24,
# CONTRIBUTING.md#releasing). Every step fails the run: nothing is published unless the tag
# matches package.json, the commit is on main, `bun run verify` passes and the packed tarball
# installs and reports the version. The tested tarball is what gets published. The GitHub release
# carries the Claude Desktop extension `sevdesk-mcp.mcpb` (scripts/mcpb.ts), built in `build`.
# `build` installs dependencies and runs their code, so it gets no write or OIDC permission;
# `publish` installs nothing and is the only job with them.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Tag matches the version, commit is on main
        id: guard
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version (expected v$version)."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME does not point to a commit on main."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Verify
        run: bun run verify
      - name: Pack
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          filename="$(npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/release" | node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8"))[0].filename')"
          echo "tarball=$filename" >> "$GITHUB_OUTPUT"
      - name: Smoke test the tarball
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          VERSION: ${{ steps.guard.outputs.version }}
        run: |
          npm install --global --prefix "$RUNNER_TEMP/smoke" "$RUNNER_TEMP/release/$TARBALL"
          actual="$("$RUNNER_TEMP/smoke/bin/sevdesk-mcp" --version)"
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::The installed package reports version '$actual', expected '$VERSION'."
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: ${{ runner.temp }}/release/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
      - name: Claude Desktop extension
        run: bun run build:mcpb
      - uses: actions/upload-artifact@v7
        with:
          name: extension
          path: build/mcpb/sevdesk-mcp.mcpb
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Deploys only from v* tags (environment rule); holds the bootstrap secret NPM_TOKEN.
    environment: npm
    permissions:
      contents: write # gh release create
      id-token: write # npm provenance, and trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@v8
        with:
          name: extension
          path: ${{ runner.temp }}/release
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish to npm
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          # Bootstrap only: the first publish creates the package with a short-lived token, since
          # trusted publishing needs an existing package. Issue #66 removes this line and
          # `registry-url` above, so later releases authenticate through OIDC alone.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --ignore-scripts "$RUNNER_TEMP/release/$TARBALL"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/release/sevdesk-mcp.mcpb" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
